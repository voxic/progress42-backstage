# Local/reference compose. Dokploy uses dokploy-compose.yml (sqlite, lean).
services:
  backstage:
    build: .
    image: ghcr.io/voxic/progress42-backstage:1.55.0
    restart: unless-stopped
    ports:
      - "7007:7007"
    environment:
      TZ: Europe/Stockholm
    volumes:
      - backstage-data:/data

volumes:
  backstage-data:
