apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: flylo-frontend
  title: FlyLo Frontend Website
  description: >
    Scaffold a new FlyLo Air marketing/frontend website component — same shape
    as FlyLo Web (catalog-info, README, owner/system). Demo template for Create.
  tags:
    - flylo
    - frontend
    - recommended
  links:
    - url: https://www.flylo-air.com/
      title: FlyLo Air
      icon: catalog
    - url: https://github.com/voxic/flylo-web
      title: Example — flylo-web
      icon: github
spec:
  owner: group:flylo/platform
  type: website
  parameters:
    - title: Component details
      required: [name, title, owner]
      properties:
        name:
          title: Name
          type: string
          description: Component name (kebab-case)
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          ui:autofocus: true
        title:
          title: Title
          type: string
          default: New FlyLo Site
        description:
          title: Description
          type: string
          default: FlyLo Air frontend experience
          ui:widget: textarea
        websiteUrl:
          title: Live website URL
          type: string
          default: https://www.flylo-air.com/
        owner:
          title: Owner
          type: string
          default: group:flylo/platform
  steps:
    - id: summarize
      name: Plan component
      action: debug:log
      input:
        message: >
          Would create frontend "${{ parameters.name }}" (${{ parameters.title }})
          owned by ${{ parameters.owner }} under system flylo-air,
          website ${{ parameters.websiteUrl }}.
          Production step: publish catalog-info to GitHub and register in catalog.
  output:
    text:
      - title: Next steps
        content: |
          Planned **${{ parameters.name }}** (${{ parameters.title }}).
          Demo Create flow complete — wire publish:github when GitHub App is connected.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: flylo-service
  title: FlyLo Backend Service
  description: >
    Scaffold a FlyLo Air backend service + OpenAPI API entity — same pattern as
    booking-backend / booking-api.
  tags:
    - flylo
    - backend
    - api
spec:
  owner: group:flylo/platform
  type: service
  parameters:
    - title: Service details
      required: [name, title, owner]
      properties:
        name:
          title: Service name
          type: string
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          ui:autofocus: true
        title:
          title: Title
          type: string
          default: New FlyLo Service
        description:
          title: Description
          type: string
          default: FlyLo Air backend service
          ui:widget: textarea
        owner:
          title: Owner
          type: string
          default: group:flylo/platform
  steps:
    - id: summarize
      name: Plan service
      action: debug:log
      input:
        message: >
          Would create service "${{ parameters.name }}" with API ${{ parameters.name }}-api,
          owner ${{ parameters.owner }}, system flylo-air.
  output:
    text:
      - title: Next steps
        content: |
          Planned **${{ parameters.name }}** + `${{ parameters.name }}-api`.
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: flylo-register-component
  title: Register existing FlyLo component
  description: >
    Register an existing repo into the catalog from a public catalog-info.yaml URL
    (raw.githubusercontent.com works for public files).
  tags:
    - flylo
    - catalog
spec:
  owner: group:flylo/platform
  type: registration
  parameters:
    - title: Catalog location
      required: [catalogInfoUrl]
      properties:
        catalogInfoUrl:
          title: catalog-info.yaml URL
          type: string
          description: Absolute URL to Backstage entity YAML
          ui:autofocus: true
  steps:
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        catalogInfoUrl: ${{ parameters.catalogInfoUrl }}
  output:
    links:
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
