apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payments-api
  description: OpenAPI for the payments service (demo stub)
  tags:
    - payments
spec:
  type: openapi
  lifecycle: production
  owner: group:default/platform-team
  system: system:default/retail-platform
  definition: |
    openapi: "3.0.0"
    info:
      title: Payments API
      version: 1.0.0
    paths:
      /health:
        get:
          summary: Health check
          responses:
            "200":
              description: OK
      /v1/charges:
        post:
          summary: Create a charge
          responses:
            "201":
              description: Created
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: inventory-api
  description: Inventory lookup API (demo stub)
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: system:default/retail-platform
  definition: |
    openapi: "3.0.0"
    info:
      title: Inventory API
      version: 0.1.0
    paths:
      /v1/sku/{sku}:
        get:
          summary: Get stock for SKU
          parameters:
            - name: sku
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: OK
