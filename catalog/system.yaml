apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: flylo-air
  title: FlyLo Air
  description: >
    FlyLo Air airline digital platform — San Francisco–based carrier bridging
    the Pacific and Atlantic from hubs at SFO and LHR. This system covers the
    public marketing site, booking stack, crew tooling, ops (Odoo), support
    (Chatwoot), and insights BI used in the Progress42 IKEA workshop demo.
