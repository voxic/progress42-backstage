apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: web
  title: FlyLo Web
  description: >
    Public marketing and booking-entry website for FlyLo Air at
    https://www.flylo-air.com/. Presents the airline brand (“the quiet way to
    fly”), route network, cabin products (Atlas / Prospect / Linen), and deep
    links into the booking experience on book.flylo-air.com. Primary demo
    surface for the Malmö IKEA workshop — Next.js-style marketing site owned
    by FlyLo Platform.
  tags:
    - frontend
    - website
    - marketing
    - nextjs
    - flylo
    - demo
  annotations:
    github.com/project-slug: flylo-air/web
    backstage.io/source-location: url:https://github.com/flylo-air/web/
    backstage.io/view-url: https://github.com/flylo-air/web
    backstage.io/edit-url: https://github.com/flylo-air/web/edit/main/README.md
    backstage.io/techdocs-ref: url:https://github.com/flylo-air/web/tree/main
  links:
    - url: https://www.flylo-air.com/
      title: Live website
      icon: catalog
    - url: https://book.flylo-air.com/
      title: Book flights
      icon: catalog
    - url: https://github.com/flylo-air/web
      title: GitHub repo
      icon: github
    - url: https://github.com/flylo-air/web/blob/main/README.md
      title: README / docs
      icon: docs
    - url: https://www.flylo-air.com/#network
      title: Route network
      icon: catalog
spec:
  type: website
  lifecycle: production
  owner: group:flylo/platform
  system: system:default/flylo-air
  dependsOn:
    - component:default/booking-frontend
    - component:default/booking-backend
  consumesApis:
    - api:default/booking-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: booking-frontend
  title: Booking Frontend
  description: >
    Customer-facing booking UI at book.flylo-air.com — flight search, fare
    selection, passenger details, and payment hand-off. Consumes the FlyLo
    booking API and is linked from the public marketing site (web).
  tags:
    - frontend
    - booking
    - flylo
  annotations:
    github.com/project-slug: flylo-air/booking-frontend
    backstage.io/source-location: url:https://github.com/flylo-air/booking-frontend/
    backstage.io/view-url: https://github.com/flylo-air/booking-frontend
    backstage.io/edit-url: https://github.com/flylo-air/booking-frontend/edit/main
  links:
    - url: https://book.flylo-air.com/
      title: Booking site
      icon: catalog
    - url: https://github.com/flylo-air/booking-frontend
      title: GitHub repo
      icon: github
    - url: https://www.flylo-air.com/
      title: Marketing site
      icon: catalog
spec:
  type: website
  lifecycle: production
  owner: group:flylo/platform
  system: system:default/flylo-air
  dependsOn:
    - component:default/booking-backend
  consumesApis:
    - api:default/booking-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: booking-backend
  title: Booking Backend
  description: >
    Booking and inventory service that powers search, holds, and confirmations
    for FlyLo Air. Provides the booking-api consumed by web and booking-frontend.
  tags:
    - backend
    - booking
    - api
    - flylo
  annotations:
    github.com/project-slug: flylo-air/booking-backend
    backstage.io/source-location: url:https://github.com/flylo-air/booking-backend/
    backstage.io/view-url: https://github.com/flylo-air/booking-backend
    backstage.io/edit-url: https://github.com/flylo-air/booking-backend/edit/main
  links:
    - url: https://github.com/flylo-air/booking-backend
      title: GitHub repo
      icon: github
    - url: https://book.flylo-air.com/
      title: Booking site
      icon: catalog
spec:
  type: service
  lifecycle: production
  owner: group:flylo/platform
  system: system:default/flylo-air
  providesApis:
    - api:default/booking-api
