apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.title }}
  description: ${{ values.description }}
  tags:
    - flylo
    - backend
    - api
    - scaffolded
  annotations:
    github.com/project-slug: ${{ values.repoOwner }}/${{ values.name }}
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: system:default/flylo-air
  providesApis:
    - api:default/${{ values.name }}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.name }}-api
  description: OpenAPI stub for ${{ values.title }}
spec:
  type: openapi
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: system:default/flylo-air
  definition: |
    openapi: "3.0.3"
    info:
      title: ${{ values.title }} API
      version: "0.1.0"
    paths:
      /health:
        get:
          summary: Health check
          responses:
            "200":
              description: OK
