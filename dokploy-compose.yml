services:
  backstage:
    image: ghcr.io/backstage/backstage:1.55.0
    restart: unless-stopped
    mem_limit: 768m
    expose:
      - "7007"
    environment:
      TZ: Europe/Stockholm
      NODE_OPTIONS: "--max-old-space-size=512"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /tmp/backstage-db
        cat > /tmp/app-config.demo.yaml <<'YAMLEOF'
        app:
          title: Progress42 Backstage
          baseUrl: https://backstage.progress42.com
        organization:
          name: Progress42
        backend:
          baseUrl: https://backstage.progress42.com
          listen:
            port: 7007
            host: 0.0.0.0
          cors:
            origin: https://backstage.progress42.com
            methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
            credentials: true
          database:
            client: better-sqlite3
            connection:
              directory: /tmp/backstage-db
        auth:
          providers:
            guest:
              dangerouslyAllowOutsideDevelopment: true
        catalog:
          rules:
            - allow: [Component, System, API, Resource, Location, User, Group, Domain]
          locations:
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/org.yaml
              rules:
                - allow: [User, Group]
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/system.yaml
              rules:
                - allow: [System]
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/components.yaml
              rules:
                - allow: [Component]
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/apis.yaml
              rules:
                - allow: [API]
        permission:
          enabled: false
        YAMLEOF
        exec node packages/backend --config app-config.yaml --config /tmp/app-config.demo.yaml
