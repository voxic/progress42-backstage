        cat > /tmp/techdocs-publish/default/component/web/techdocs_metadata.json <<'METAEOF'
        {"site_name": "FlyLo Web", "site_description": "Public marketing site for FlyLo Air", "etag": "flylo-web-demo-1", "build_timestamp": 1789992270, "files": ["index.html", "techdocs_metadata.json"]}
        METAEOF
        echo "Loading Software Templates from GitHub..."
        node <<'NODEEOF'
        const fs = require('fs');
        const { execSync } = require('child_process');
        const base = 'https://raw.githubusercontent.com/voxic/progress42-backstage/main';
        async function get(path) {
          const res = await fetch(base + path);
          if (!res.ok) throw new Error('GET ' + path + ' ' + res.status);
          return Buffer.from(await res.arrayBuffer());
        }
        (async () => {
          fs.mkdirSync('/tmp/catalog', { recursive: true });
          fs.mkdirSync('/tmp/skeletons', { recursive: true });
          fs.writeFileSync('/tmp/catalog/templates.yaml', await get('catalog/templates.yaml'));
          const tgz = await get('skeletons/flylo-skeletons.tgz');
          fs.writeFileSync('/tmp/flylo-skeletons.tgz', tgz);
          execSync('tar xzf /tmp/flylo-skeletons.tgz -C /tmp/skeletons');
          console.log('templates+skeletons ready');
        })().catch((e) => { console.error(e); process.exit(1); });
        NODEEOF
        cat > /tmp/app-config.demo.yaml <<'YAMLEOF'


        app:
          title: Progress42 Backstage
          baseUrl: https://backstage.progress42.com
        organization:
          name: Progress42
        backend:
          baseUrl: https://backstage.progress42.com
          listen:
            port: 7007
            host: 0.0.0.0
          cors:
            origin: https://backstage.progress42.com
            methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
            credentials: true
          reading:
            allow:
              - host: raw.githubusercontent.com
          database:
            client: better-sqlite3
            connection:
              directory: /tmp/backstage-db
        auth:
          providers:
            guest:
              dangerouslyAllowOutsideDevelopment: true
        catalog:
          rules:
            - allow: [Component, System, API, Resource, Location, User, Group, Domain, Template]
          locations:
            - type: file
              target: /tmp/catalog/org.yaml
              rules:
                - allow: [User, Group]
            - type: file
              target: /tmp/catalog/system.yaml
              rules:
                - allow: [System]
            - type: file
              target: /tmp/catalog/apis.yaml
              rules:
                - allow: [API]
            - type: file
              target: /tmp/catalog/components.yaml
              rules:
                - allow: [Component]
            - type: file
              target: /tmp/catalog/templates.yaml
              rules:
                - allow: [Template]
        techdocs:
          builder: external
          publisher:
            type: local
            local:
              publishDirectory: /tmp/techdocs-publish
        permission:
          enabled: false
        YAMLEOF
        exec node packages/backend --config app-config.yaml --config /tmp/app-config.demo.yaml
