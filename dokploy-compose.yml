services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage_demo_p42
      POSTGRES_DB: backstage
      TZ: Europe/Stockholm
    volumes:
      - backstage-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage -d backstage"]
      interval: 5s
      timeout: 5s
      retries: 30

  backstage:
    image: ghcr.io/backstage/backstage:1.55.0
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Stockholm
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage_demo_p42
      POSTGRES_DB: backstage
      NODE_OPTIONS: "--max-old-space-size=512"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /tmp/app-config.demo.yaml <<'YAMLEOF'
        app:
          title: Progress42 Backstage
          baseUrl: https://backstage.progress42.com
        organization:
          name: Progress42
        backend:
          baseUrl: https://backstage.progress42.com
          listen:
            port: 7007
            host: 0.0.0.0
          cors:
            origin: https://backstage.progress42.com
            methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
            credentials: true
          database:
            client: pg
            connection:
              host: ${POSTGRES_HOST}
              port: ${POSTGRES_PORT}
              user: ${POSTGRES_USER}
              password: ${POSTGRES_PASSWORD}
              database: ${POSTGRES_DB}
        auth:
          environment: production
          providers:
            guest:
              dangerouslyAllowOutsideDevelopment: true
        catalog:
          rules:
            - allow: [Component, System, API, Resource, Location, User, Group, Domain]
          locations:
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/org.yaml
              rules:
                - allow: [User, Group]
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/system.yaml
              rules:
                - allow: [System]
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/components.yaml
              rules:
                - allow: [Component]
            - type: url
              target: https://raw.githubusercontent.com/voxic/progress42-backstage/main/catalog/apis.yaml
              rules:
                - allow: [API]
        permission:
          enabled: false
        YAMLEOF
        # Wait for postgres briefly (healthcheck already gates depends_on)
        exec node packages/backend --config app-config.yaml --config /tmp/app-config.demo.yaml

volumes:
  backstage-pg:
