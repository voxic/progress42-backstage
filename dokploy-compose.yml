              title: Marketing site
              icon: catalog
        spec:
          type: openapi
          lifecycle: production
          owner: group:flylo/platform
          system: system:default/flylo-air
          definition: |
            openapi: "3.0.3"
            info:
              title: FlyLo Booking API
              version: "1.0.0"
              description: Demo OpenAPI stub for FlyLo Air booking (IKEA workshop).
            paths:
              /v1/flights/search:
                get:
                  summary: Search flights
                  parameters:
                    - name: from
                      in: query
                      schema: { type: string }
                    - name: to
                      in: query
                      schema: { type: string }
                    - name: date
                      in: query
                      schema: { type: string, format: date }
                  responses:
                    "200":
                      description: Flight search results
              /v1/bookings:
                post:
                  summary: Create booking hold
                  responses:
                    "201":
                      description: Booking held
        CATEOF
        cat > /tmp/catalog/components.yaml <<'CATEOF'
